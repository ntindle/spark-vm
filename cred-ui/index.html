<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credentials</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 16px;
         background: #111; color: #eee; max-width: 720px; margin-inline: auto; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .sub { color: #999; font-size: .85rem; margin-bottom: 16px; }
  .card { background: #1c1c1c; border: 1px solid #333; border-radius: 10px;
          padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 1rem; margin: 0 0 10px; }
  label { display: block; font-size: .8rem; color: #aaa; margin: 8px 0 4px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px;
      border-radius: 8px; border: 1px solid #444; background: #222; color: #eee;
      font-size: 1rem; }
  textarea { min-height: 56px; font-family: monospace; }
  button { padding: 10px 16px; border-radius: 8px; border: none; font-size: 1rem;
           cursor: pointer; }
  .primary { background: #2f7cf6; color: #fff; width: 100%; margin-top: 12px; }
  .danger { background: #5a2020; color: #f88; padding: 6px 10px; font-size: .85rem; }
  .small { background: #333; color: #ddd; padding: 6px 10px; font-size: .85rem; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #2a2a2a;
           vertical-align: top; }
  th { color: #999; font-weight: 600; font-size: .78rem; text-transform: uppercase; }
  .mono { font-family: monospace; font-size: .85rem; }
  .ok { color: #6d6; } .warn { color: #fc6; } .bad { color: #f66; }
  .host { display: inline-block; background: #2a2a2a; border-radius: 6px;
          padding: 2px 8px; margin: 2px 4px 2px 0; font-size: .82rem; }
  .host button { background: none; color: #f88; padding: 0 0 0 6px; font-size: .9rem; }
  .row { display: flex; gap: 8px; margin-top: 6px; }
  .row input { flex: 1; padding: 6px 8px; font-size: .85rem; }
  #status { min-height: 1.2em; font-size: .85rem; margin-top: 10px; }
  #refresh-note { font-size: .78rem; color: #777; }
  .hidden { display: none; }
  /* Phone view: the stored-credentials table is ~500px wide at full
     layout, so at phone widths it overflows and clips the hosts and
     delete columns. Below 520px each row becomes a stacked card, so
     cred-ui is genuinely usable over an SSH tunnel from a phone. */
  @media (max-width: 520px) {
    #list table, #list tbody, #list tr, #list td { display: block; width: 100%;
      box-sizing: border-box; }
    #list thead { display: none; }
    #list tr { border: 1px solid #333; border-radius: 10px; padding: 4px 12px 8px;
      margin-bottom: 12px; background: #1c1c1c; }
    #list td { border-bottom: none; padding: 6px 0; }
    #list td:nth-child(1)::before { content: "Name"; }
    #list td:nth-child(2)::before { content: "State"; }
    #list td:nth-child(3)::before { content: "Hosts"; }
    #list td::before { display: block; font-size: .72rem; color: #999;
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
    #list td:nth-child(4) .danger { width: 100%; }
  }
</style>
</head>
<body>
<h1>Credentials</h1>
<div class="sub">swapd store on spark-vm &middot; values are never displayed
  &middot; <span id="refresh-note">auto-refreshing…</span></div>

<div class="card hidden" id="unlock-card">
  <h2>Unlock</h2>
  <p class="sub">Paste the per-install API token once per browser session.
    On spark-vm: <span class="mono">python3 ~/.local/share/spark-vm/cred-ui/cred-ui.py --print-token</span></p>
  <label for="f-token">API token</label>
  <input id="f-token" type="password" autocomplete="off" placeholder="paste token">
  <button class="primary" id="btn-unlock">Unlock</button>
  <div id="unlock-status"></div>
</div>
<div class="card" id="lock-row" style="display:flex;justify-content:space-between;align-items:center">
  <span class="sub" id="lock-state">unlocked</span>
  <button class="small" id="btn-lock">Lock</button>
</div>

<div class="card">
  <h2>Add / update credential</h2>
  <label for="f-name">Name</label>
  <input id="f-name" autocomplete="off" placeholder="github" pattern="[A-Za-z0-9_-]+">
  <label for="f-value">Secret value</label>
  <input id="f-value" type="password" autocomplete="new-password" placeholder="paste token">
  <label for="f-entry">Entry</label>
  <input id="f-entry" value="access_token" autocomplete="off">
  <label for="f-placement">Placement</label>
  <select id="f-placement">
    <option value="bearer_header">Authorization: Bearer header</option>
    <option value="custom_header">Custom header</option>
    <option value="query_param">Query parameter</option>
    <option value="url_path_segment">URL path segment</option>
  </select>
  <div id="arg-wrap" class="hidden">
    <label for="f-arg" id="f-arg-label">Header name</label>
    <input id="f-arg" autocomplete="off" placeholder="X-Api-Key">
  </div>
  <label for="f-hosts">Allowed hosts (one per line)</label>
  <textarea id="f-hosts" placeholder="api.github.com"></textarea>
  <button class="primary" id="btn-save">Save credential</button>
  <div id="status"></div>
</div>

<div class="card">
  <h2>Stored credentials</h2>
  <div id="list"><p class="sub">loading…</p></div>
</div>

<script>
const $ = id => document.getElementById(id);
const placementSel = $('f-placement'), argWrap = $('arg-wrap');

function syncArg() {
  const v = placementSel.value;
  const bare = v === 'bearer_header' || v === 'url_path_segment';
  argWrap.classList.toggle('hidden', bare);
  // A stale arg value must not ride along with a bare kind: placement_json
  // rejects non-empty args for bare kinds loudly, so clear the field here to
  // keep that rejection meaningful (hand-built requests only).
  if (bare) $('f-arg').value = '';
  $('f-arg-label').textContent = v === 'custom_header' ? 'Header name' : 'Parameter name';
  $('f-arg').placeholder = v === 'custom_header' ? 'X-Api-Key' : 'api_key';
}
placementSel.addEventListener('change', syncArg); syncArg();

function esc(s) { return String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Per-install API token (issue #86): kept in sessionStorage — a tab's
// lifetime, never localStorage, never a cookie, never a URL. Every API
// call routes through apiFetch so the token rides along; a 401 means the
// token is wrong or was rotated server-side, so we drop it and show the
// unlock card instead of hammering the server.
let apiToken = sessionStorage.getItem('cred-ui-token') || '';

function setLocked(locked, note) {
  $('unlock-card').classList.toggle('hidden', !locked);
  $('lock-row').style.display = locked ? 'none' : 'flex';
  if (note !== undefined) $('unlock-status').textContent = note;
  $('refresh-note').textContent = locked ? 'locked — paste the API token' : 'auto-refreshing…';
  // A locked UI must not keep showing the credential names/placements
  // from before the lock (the token gate exists to keep them from local
  // eyes); the next successful refresh() re-renders the list.
  if (locked) $('list').innerHTML = '<p class="sub">locked</p>';
}

function requireToken() {
  if (!apiToken) { setLocked(true); return false; }
  return true;
}

async function apiFetch(path, opts) {
  opts = opts || {};
  const headers = Object.assign({'X-Cred-UI': '1'}, opts.headers || {});
  if (apiToken) headers['Authorization'] = 'Bearer ' + apiToken;
  const r = await fetch(path, Object.assign({}, opts, {headers, cache: 'no-store'}));
  if (r.status === 401) {
    apiToken = '';
    sessionStorage.removeItem('cred-ui-token');
    setLocked(true, 'token rejected — paste the current token');
    throw new Error('HTTP 401');
  }
  return r;
}

$('btn-unlock').addEventListener('click', async () => {
  const t = $('f-token').value.trim();
  $('f-token').value = '';
  if (!t) { $('unlock-status').textContent = 'paste the token first'; return; }
  apiToken = t;
  try {
    const r = await apiFetch('/api/creds');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    sessionStorage.setItem('cred-ui-token', t);
    setLocked(false);
    $('lock-state').textContent = 'unlocked';
    refresh();
  } catch (e) {
    apiToken = '';
    $('unlock-status').textContent = 'token rejected — ' + e;
  }
});

$('btn-lock').addEventListener('click', () => {
  apiToken = '';
  sessionStorage.removeItem('cred-ui-token');
  $('lock-state').textContent = 'locked';
  setLocked(true);
});

let lastOk = 0;
async function refresh() {
  if (!requireToken()) return;
  try {
    const r = await apiFetch('/api/creds');
    // A non-OK status (e.g. the store is damaged or unreadable) must NOT
    // render as an empty list: "none stored" would lie to the operator
    // about credentials that still exist on disk (issue #672).
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    render(data.creds || []);
    lastOk = Date.now();
    $('refresh-note').textContent = 'updated just now';
  } catch (e) {
    // A 401 already showed the unlock card (apiFetch clears the token
    // and re-locks) — don't also paint the store-damaged message; the
    // token is just missing or was rotated server-side.
    if (!apiToken) {
      $('refresh-note').textContent = 'locked — paste the API token';
      return;
    }
    // render()'s typing guard applies here too: a failed poll must not
    // rebuild the table mid-typing and destroy the in-flight "add host"
    // input — the error text only replaces the list when no input inside
    // it is focused. (PR #696 review follow-up.)
    if (!(document.activeElement && $('list').contains(document.activeElement))) {
      $('list').innerHTML = '<p class="bad">couldn\u2019t load the credential list — the credential store may be damaged or unreadable. Nothing was changed; retrying\u2026</p>';
    }
    $('refresh-note').textContent = 'refresh failed — retrying…';
  }
}

function render(creds) {
  // Skip the re-render while the user is typing in an add-host input --
  // rebuilding the table via innerHTML would destroy it and lose the text.
  if (document.activeElement && $('list').contains(document.activeElement)) return;
  if (!creds.length) { $('list').innerHTML = '<p class="sub">none stored</p>'; return; }
  let h = '<table><thead><tr><th>Name</th><th>State</th><th>Hosts</th><th></th></tr></thead><tbody>';
  for (const c of creds) {
    const entries = Object.entries(c.entries).map(([e, p]) =>
      '<div class="mono">' + esc(e) + ' → ' + esc(typeof p === 'string' ? p : JSON.stringify(p)) + '</div>').join('');
    const state = (c.has_value ? '<span class="ok">● value stored</span>' : '<span class="bad">● no value</span>') +
      (c.registered ? '' : ' <span class="warn">(not registered — never swaps)</span>') +
      (entries ? '<div style="margin-top:4px">' + entries + '</div>' : '');
    const hosts = c.allowed_hosts.map(x =>
      '<span class="host">' + esc(x) +
      '<button data-del-host="' + esc(c.name) + '|' + esc(x) + '" title="remove">×</button></span>').join('');
    h += '<tr><td class="mono"><b>' + esc(c.name) + '</b></td><td>' + state + '</td>' +
         '<td>' + hosts +
         '<div class="row"><input placeholder="add host" data-add-host="' + esc(c.name) + '">' +
         '<button class="small" data-add-btn="' + esc(c.name) + '">+</button></div></td>' +
         '<td><button class="danger" data-del="' + esc(c.name) + '">delete</button></td></tr>';
  }
  $('list').innerHTML = h + '</tbody></table>';
}

$('list').addEventListener('click', async ev => {
  const t = ev.target;
  const setStatus = m => { $('status').textContent = m; };
  try {
  if (t.dataset.del) {
    if (!confirm('Delete credential "' + t.dataset.del + '" (value + registration)?')) return;
    const r = await apiFetch('/api/delete', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: t.dataset.del})});
    const d = await r.json();
    setStatus(d.ok ? 'deleted ' + t.dataset.del : 'error: ' + (d.error || r.status));
    refresh();
  } else if (t.dataset.delHost) {
    const [name, host] = t.dataset.delHost.split('|');
    await apiFetch('/api/host/remove', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, host})});
    refresh();
  } else if (t.dataset.addBtn) {
    const name = t.dataset.addBtn;
    const input = document.querySelector('input[data-add-host="' + CSS.escape(name) + '"]');
    const host = (input.value || '').trim();
    if (!host) return;
    const r = await apiFetch('/api/host/add', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, host})});
    const d = await r.json();
    if (!d.ok) setStatus('error: ' + (d.error || r.status));
    refresh();
  }
  } catch (e) {
    // apiFetch throws on 401 (unlock card already shown, token cleared);
    // surface anything else instead of an unhandled rejection.
    if (apiToken) setStatus('request failed: ' + e);
  }
});

$('btn-save').addEventListener('click', async () => {
  const hosts = $('f-hosts').value.split('\n').map(s => s.trim()).filter(Boolean);
  const body = {
    name: $('f-name').value.trim(),
    value: $('f-value').value,
    entry: $('f-entry').value.trim() || 'access_token',
    placement: placementSel.value,
    placement_arg: $('f-arg').value.trim(),
    hosts
  };
  $('status').textContent = 'saving…';
  try {
    const r = await apiFetch('/api/set', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if (d.ok) {
      $('status').textContent = 'saved ' + d.name;
      $('f-value').value = '';
      refresh();
    } else {
      $('status').textContent = 'error: ' + (d.error || r.status);
    }
  } catch (e) {
    $('status').textContent = 'error: ' + e;
  }
});

setInterval(() => {
  if (lastOk) {
    const s = Math.round((Date.now() - lastOk) / 1000);
    $('refresh-note').textContent = s < 5 ? 'updated just now' : 'updated ' + s + 's ago';
  }
}, 1000);
setInterval(refresh, 3000);
// Initial state: no token in sessionStorage means the unlock card shows
// first (refresh() would no-op through requireToken()).
setLocked(!apiToken);
if (apiToken) $('lock-state').textContent = 'unlocked';
else $('lock-state').textContent = 'locked';
refresh();
</script>
</body>
</html>
