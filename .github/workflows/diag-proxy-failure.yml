name: diag-proxy-failure
# TEMPORARY diagnostic: reports the ubuntu-latest-only proxy test failure
# for PR #202 as a PR comment (Actions logs are not anonymously readable).
# Scoped to PR #202 only. DELETE THIS FILE once diagnosed.
on:
  pull_request:
    branches: [main]
permissions:
  pull-requests: write
jobs:
  diag:
    if: github.event.pull_request.number == 202
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: proxy tests, verbose
        id: pt
        working-directory: proxy
        run: |
          set +e
          python3 -m pytest test_swap_addon.py test_grant_writer.py test_round6.py -v --tb=short > /tmp/pytest-proxy.log 2>&1
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          echo "---- tail ----"
          tail -40 /tmp/pytest-proxy.log
          exit 0
      - name: report failures as PR comment
        if: steps.pt.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF' > /tmp/failures.md
          log = open('/tmp/pytest-proxy.log').read().splitlines()
          failed = [l for l in log
                    if l.startswith('FAILED') or l.startswith('ERROR')]
          out = ["## diagnostic: proxy test failure on ubuntu-latest",
                 "",
                 "### failing tests"]
          out += ["- " + f for f in failed] or ["- (none matched FAILED/ERROR)"]
          out += ["", "### summary tail", "```"]
          # pytest short summary section is at the end; keep last 60 lines
          out += log[-60:]
          out += ["```"]
          print("\n".join(out))
          EOF
          wc -c /tmp/failures.md
          gh pr comment 202 --body-file /tmp/failures.md
