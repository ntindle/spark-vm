        # not a broken link.
        # www.huawei.com 403s/blocks automated fetchers on GitHub Actions
        # runner egress (bot-block; the Huawei Cloud CodeArts Agent
        # Malaysia commercial-launch press release hand-verified live
        # 2026-09-27 ~07:2x CDT via real browser — HTTP 200, title
        # "Huawei Cloud Unveils CodeArts Agent for Enterprise-grade AI
        # Coding in Malaysia", Sep-18 dateline, and the CodeArts Agent
        # commercial-launch claims all match the C67
        # FIRST-PARTY-CORROBORATED citation in the midday watch pass).
        # Runner-egress IP reputation, not a broken link.
        # cdm.link 403s automated fetchers on GitHub Actions runner egress
        # (bot-block; the MPEG LA H.264 royalty-free-license editorial
        # hand-verified live 2026-09-27 ~19:05 CDT via real browser fetch —
        # the site answers with a CrowdSec captcha challenge, i.e. the host
        # is live and bot-blocking, not a dead link; the flagged URL is the
        # CODEC_LICENSING_RESEARCH citation). Runner-egress IP reputation,
        # not a broken link.
        # lifestyle.thepointnews.com 403s automated fetchers (bot-block;
        # the Guava "Daytona" voice-model press-release page hand-verified
        # live 2026-09-29 ~03:2x CDT via real browser — full article loads,
        # headline "Guava Launches Daytona, a State of the Art Voice Model,
        # alongside an Open Benchmark Evaluating Voice Agent Performance"
        # matches the Sep-24 evening watch citation; lychee 403s the same
        # URL from two independent egresses, and it passed CI ~35 min
        # earlier on #666 — newly bot-blocking, not a dead link).
        # Runner-egress IP reputation, not a broken link.
        # lifestyle.independent.mk 403s automated fetchers (bot-block; the
        # TermSquad launch press-release page hand-verified live 2026-09-30
        # ~09:35 CDT via real browser — full article loads, headline
        # "TermSquad Launches an Always-On Cloud Computer for AI Coding
        # Agents" + EIN Presswire body match the
        # RESEARCH_AGENT_SANDBOX_ADOPTION.md citation; lychee 403s it from
        # GitHub egress and curl 403s it from the loop's egress too, while
        # this PR's round-1 head passed the same check ~10 min earlier with
        # no URL changes in between — newly bot-blocking, not a dead link).
        # Excluded at host level (not per-URL): new links
        # from these hosts trip the same bot blocks, so the exclusion must
        # cover the whole host. When adding a link from one of these hosts,
        # open it in a real browser and confirm the page loads and matches
        # the cited headline; a browser 404 means the link is genuinely
        # broken — fix the link, don't extend the exclusion.
        # BACKSLASH NOTE: this string is YAML double-quoted, so the two-char `\\`
        # in this file reaches the action as a single `\`; the action evals
        # its args through bash single quotes (which pass backslashes
        # through literally), so lychee finally sees `\.` (regex: literal
        # dot). Do NOT "fix" these to `\\\\` — that
        # makes the regex demand a literal backslash and silently disables
        # all eight excludes. (Backslash counts are easy to misread through
        # tool display escaping — verify with `od -c`, not by eye.)
        # Ritual compare links (github.com/ntindle/spark-vm/compare/...) are
        # excluded: the release ritual (docs/VERSIONING.md) writes them at
        # bump time pointing at the tag the release workflow cuts AFTER merge,
        # so they 404 by design until the release lands. They are
        # machine-generated from the ritual's fixed pattern, so a typo there
        # is near-impossible and excluding them hides no real link.
        # e2b.dev, agentcomputer.ai, boxd.sh, and docs.docker.com block
        # automated fetchers on GitHub Actions runner egress (bot-block; all
        # four hand-verified live 2026-09-26 ~17:15 CDT via real browser
        # fetch — e2b.dev/pricing loads the full pricing page, boxd.sh loads
        # the homepage, agentcomputer.ai/pricing loads the pricing table,
        # docs.docker.com/ai/sandboxes/release-notes/ loads the release
        # notes — the lychee errors are runner-egress IP reputation, not
        # broken links). CI on #504 failed the markdown link check twice on
        # these (2026-09-26); main was green ~40 min earlier with no URL
        # changes in between, so this is a newly bot-blocking egress, not
        # a docs regression.
        # GitHub file-view (`blob`) pages 503/429 automated fetchers on
        # GitHub Actions runner egress (rate-limit; verified 2026-10-02:
        # on the CI run that red-lit PRs #833/#834, all 46 failing
        # github.com URLs were `/<owner>/<repo>/blob/` HTML views —
        # repo roots and /compare/ links passed — and curl from two
        # independent egresses returned 503/429 on the same URLs, so this
        # is rate-limiting, not broken links). The exclude pattern stays
        # narrow (only the blob-view path class) so a genuinely broken
        # link elsewhere on github.com still fails the check; when adding
        # a github.com blob link, open it in a real browser and confirm
        # the page loads.
        # docs.ascii.dev (legacy ASCII docs domain) refuses connections on
        # GitHub Actions runner egress (bot-block; verified 2026-10-02:
        # `docs.ascii.dev/box/api/v1` 301s to `docs.boat.dev/box/api/v1`,
        # final HTTP 200 rendering "Boat Public API v1" — the domain is
        # live, the block is runner-egress IP reputation). The two cited
        # URLs keep their ascii.dev form on purpose: the citations'
        # evidence was read on the legacy domain when the ASCII→Boat
        # rename was verified, and the corpus already documents the
        # redirect — the exclude preserves citation integrity instead of
        # rewriting history.
        # ipfray.com 429s / times out automated fetchers (bot rate-limit;
        # verified 2026-10-07: three consecutive CI link-check failures
        # on PR #1123 — 7x 429 plus timeouts, all on the pre-existing
        # CODEC_LICENSING_RESEARCH.md citations, zero new links in the
        # PR — and curl with a browser UA 429s from independent egress
        # too, while the flagged article loads fully in a real browser
        # with content matching the citation. Rate-limiting, not broken
        # links.)
        # x264.org 403s automated fetchers (bot-block; verified 2026-10-09:
        # three consecutive CI link-check failures on PR #1201 on the
        # pre-existing CODEC_LICENSING_RESEARCH.md citations (zero new
        # links in the PR) — and curl with a browser UA 403s from
        # independent egress too, while https://x264.org/technology/ loads
        # fully in a real browser with the licensing page matching the
        # VENDOR-VERIFIED citation. Bot-block, not a broken link.)
        # marktechpost.com 403s automated fetchers (bot-block; verified
        # 2026-10-09: CI link-check failures on PR #1201 on the
        # pre-existing COMPETITOR_WATCH_2026-09-19_EVENING.md pricing-sweep
        # citation (zero new links in the PR) — and curl with a browser UA
        # 403s from independent egress too, while the best-agent-sandboxes
        # article loads fully in a real browser with the cold-start /
        # pricing comparison matching the citation. Bot-block, not a
        # broken link.)
        # investors.digitalocean.com 403s automated fetchers (bot-block;
        # verified 2026-10-09: CI link-check failures on PR #1201 on the
        # pre-existing COMPETITOR_WATCH_2026-09-25_MIDDAY.md citation
        # (zero new links in the PR) — and curl with a browser UA 403s
        # from independent egress too, while the Managed Agents launch IR
        # page loads fully in a real browser with the $0.044/vCPU-hr and
        # $0.0095/GB-hr billing line matching the VENDOR-VERIFIED
        # citation. Bot-block, not a broken link.)
        # bugs.webkit.org 502s automated fetchers on GitHub Actions runner
        # egress (bot-block; verified 2026-10-09: CI link-check failed twice
        # on PR #1222 on the pre-existing CODEC_LICENSING_RESEARCH.md
        # citations (zero new links in the PR) — and the bug page loads fully
        # in a real browser with the title "173141 – No VP8/VP9 Video Codec
        # Support in WebRTC" matching the "WebKit bug 173141 — VP8 in Safari
        # WebRTC" citation. Bot-block, not a broken link.)
        # SHA-pinned (e7477775783ea5526144ba13e8db5eec57747ce8, v2.9.0) so a
        # tag drift can't widen what this step can do.
        # When adding an --exclude below, regenerate docs/CI.md's
        # `link-check-excludes` inventory to match (pinned by
        # scripts/test_ci_md_link_excludes.py, which also rides the
        # docs-guard gate — a docs-only PR editing the block is checked
        # there). The pin fails CI on any mismatch.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: "--no-progress --exclude-loopback --exclude 'https?://github\\.com/ntindle/spark-vm/compare/.*' --exclude 'https?://(www\\.)?medium\\.com/.*' --exclude 'https?://(www\\.)?businesswire\\.com/.*' --exclude 'https?://(www\\.)?globenewswire\\.com/.*' --exclude 'https?://(www\\.)?daytona\\.io/.*' --exclude 'https?://(www\\.)?fourweekmba\\.com/.*' --exclude 'https?://(www\\.)?tvgreport\\.com/.*' --exclude 'https?://([a-z0-9-]+\\.)?boat\\.dev/.*' --exclude 'https?://(www\\.)?producthunt\\.com/.*' --exclude 'https?://(www\\.)?openai\\.com/.*' --exclude 'https?://(www\\.)?itbrief\\.com\\.au/.*' --exclude 'https?://(www\\.)?itbrief\\.asia/.*' --exclude 'https?://cloud\\.google\\.com/.*' --exclude 'https?://automaid\\.it\\.com/.*' --exclude 'https?://(www\\.)?epho\\.io/.*' --exclude 'https?://(www\\.)?wowza\\.com/.*' --exclude 'https?://(www\\.)?termsquad\\.com/.*' --exclude 'https?://([a-z0-9-]+\\.)?perplexity\\.ai/.*' --exclude 'https?://(www\\.)?dev\\.to/.*' --exclude 'https?://(www\\.)?mactech\\.com/.*' --exclude 'https?://(www\\.)?financialcontent\\.com/.*' --exclude 'https?://([a-z0-9-]+\\.)?marketminute\\.com/.*' --exclude 'https?://(www\\.)?red5\\.net/.*' --exclude 'https?://(www\\.)?theregister\\.com/.*' --exclude 'https?://(www\\.)?pocketnews\\.com\\.my/.*' --exclude 'https?://(www\\.)?gamingonlinux\\.com/.*' --exclude 'https?://web\\.archive\\.org/web/20260605034053/https://www\\.startuphub\\.ai/ai-news/artificial-intelligence/2026/daytona-vs-e2b-vs-modal-vs-vercel-sandbox-2026' --exclude 'https?://(www\\.)?huawei\\.com/.*' --exclude 'https?://e2b\\.dev/.*' --exclude 'https?://(www\\.)?agentcomputer\\.ai/.*' --exclude 'https?://boxd\\.sh/.*' --exclude 'https?://docs\\.docker\\.com/.*' --exclude 'https?://(www\\.)?cdm\\.link/.*' --exclude 'https?://(www\\.)?lifestyle\\.thepointnews\\.com/.*' --exclude 'https?://lifestyle\\.independent\\.mk/.*' --exclude 'https?://github\\.com/[^/]+/[^/]+/blob/.*' --exclude 'https?://([a-z0-9-]+\\.)?ascii\\.dev/.*' --exclude 'https?://(www\\.)?ipfray\\.com/.*' --exclude 'https?://(www\\.)?x264\\.org/.*' --exclude 'https?://(www\\.)?marktechpost\\.com/.*' --exclude 'https?://investors\\.digitalocean\\.com/.*' --exclude 'https?://bugs\\.webkit\\.org/.*' '**/*.md'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  png-check:
    name: PNG screenshot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          # --with-deps installs OS deps itself (escalates internally); a sudo
          # install-deps line would fail since root's Python lacks the runner
          # user's site-packages.
          python3 -m playwright install --with-deps chromium
      - name: Screenshot + validate PNG signature
        run: |
          rm -f /tmp/pw-test.png  # stale screenshot must not mask a pw-test failure
          python3 scripts/pw-test.py
          python3 scripts/png-check.py
