# spark-vm CI: python tests, shellcheck, markdown link check, PNG smoke test.
#
# Run locally with (from the repo root — the one-liner in CONTRIBUTING.md):
#   python3 -m pytest
# (`pytest.ini` testpaths enumerate every suite; CI runs exactly this, so a
# suite can never land unwired the way the old per-directory lists allowed.)
#   # the two seteuid install-safety tests self-skip as non-root; CI runs them under sudo:
#   sudo SAFE_INSTALL_ROOT_TESTS=require "$(command -v python3)" -m pytest proxy/test_safe_install.py -k 'unreachable_by_parent_dir_attacker or staging_dir_swap_fails_closed' -q
#   python3 scripts/lint-changelog-ritual.py  # changelog ritual lint (enforced as a CI job too)

name: ci

# Least privilege: this workflow only reads the repo and reports status.
# Runs on push to main, where a compromised third-party action with a
# writable token could otherwise touch a tree that auto-deploys sudoers
# files, a CA bundle, and the credential-swapping proxy.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The merge gate proves exactly what a contributor runs locally
      # (CONTRIBUTING.md "Running the tests"): requirements-test.txt is the
      # whole dependency set — pytest, cryptography (confirm/push.py's Web
      # Push tests), pillow (waitlist page og:image assertions). mitmproxy
      # is a *deploy* dependency, never imported by a test module.
      - name: install test dependencies
        run: pip install -r requirements-test.txt
      # cua/test_shell_scripts.py gates on shellcheck warnings; pin it
      # explicitly rather than relying on the runner image carrying it.
      # (2026-09-18: the runner-preinstalled shellcheck caught 5 warnings the
      # PR author could not reproduce locally — the gate must be deterministic.)
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: full test suite (repo-root one-liner)
        # pytest.ini testpaths enumerate every suite, so this step can never
        # silently drop one the way the old per-directory file lists did
        # (~two dozen suites landed unwired before 2026-09-27). pytest continues past
        # a failing suite and reports every failure at the end, so one red
        # suite cannot mask another. scripts/test_pytest_ini_covers_all.py
        # pins the residual drift class: a test_*.py outside testpaths fails
        # the run instead of never running.
        # if: always(): never let an infra flake in an earlier setup step
        # (shellcheck's apt-get, pip) skip the whole suite and void the
        # merge gate's test signal.
        if: always()
        run: python3 -m pytest -q
      - name: proxy install-safety root tests (substitution regression)
        # test_staged_temp_unreachable_by_parent_dir_attacker and
        # test_staging_dir_swap_fails_closed self-skip as non-root, so the
        # one-liner above never executes the staged-temp substitution TOCTOU
        # guard (issue #336). Run them under sudo so the merge gate proves
        # the guard; SAFE_INSTALL_ROOT_TESTS=require turns a self-skip into
        # a failure, so a skipped test can never read as a green build.
        # (Pytest exits 5 if the -k selection ever matches nothing, e.g.
        # after a rename -- also a failure.)
        if: always()
        # NB: sudo resets PATH to secure_path, so bare `python3` would resolve
        # to /usr/bin/python3 (no pytest) -- that failed the CI step with
        # "No module named pytest". Resolve the setup-python interpreter OUTSIDE
        # sudo (setup-python puts it first on PATH) and pass it as an absolute
        # path; sudo's VAR=value form still carries SAFE_INSTALL_ROOT_TESTS.
        run: sudo SAFE_INSTALL_ROOT_TESTS=require "$(command -v python3)" -m pytest proxy/test_safe_install.py -k 'unreachable_by_parent_dir_attacker or staging_dir_swap_fails_closed' -q

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all shell scripts
        # pinned SHA: action unmaintained since 2024, SHA protects against
        # branch drift (00b27aa7cb85167568cb48a3838b75f4265f2bca, 2024-06-20)
        # severity=error gates on real breakage (syntax/misuse), not style notes
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          severity: error

  changelog-ritual:
    name: changelog ritual lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Enforces CHANGELOG.md's own ritual (rules 1 + 4): entries must not
      # reference workspace-internal paths (agent_notes/, hidden_files/,
      # workspace/goals/) that never exist in a reader's checkout. The
      # ritual preamble that documents the rule is exempt (see the script).
      - name: lint changelog for workspace-internal path references
        run: python3 scripts/lint-changelog-ritual.py

  markdown-links:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in all markdown docs
        # --exclude-mail was removed upstream (lychee >= 0.20 excludes mail by
        # default); passing it fails the step with "unexpected argument".
        # --exclude-loopback: docs reference localhost service addresses
        # (cred-ui, proxy) that can never resolve on a CI runner.
        # Bot-blocking hosts: medium.com 403s every automated fetcher
        # (2026-09-19, CI on #39); www.daytona.io 403s automated fetchers too
        # (bot-block; security exhibit page hand-verified live 2026-09-20,
        # quoted text matches verbatim). businesswire.com / globenewswire.com reject
        # lychee's HTTP client (HTTP/2 protocol errors) — the flagged URLs
        # were all hand-verified live that day, so these are false positives,
        # not broken links. fourweekmba.com 403s automated fetchers (bot-block;
        # page hand-verified live 2026-09-20 via real browser — full article
        # loads, headline matches the midday watch's Agents API citation).
        # mactech.com 500s automated fetchers on GitHub Actions runner
        # egress (bot-block; the MPEG LA H.264 royalty-free article
        # hand-verified live 2026-09-25 ~21:0x CDT via curl — HTTP 200,
        # page loads, matches the codec-licensing diligence citation).
        # The 500 is runner-egress IP reputation, not a broken link.
        # financialcontent.com and marketminute.com (GlobeNewswire press-release
        # syndication hosts) 404 lychee on GitHub Actions runner egress
        # (bot-block; both flagged articles — the 2026-09-24 Docker cloud
        # sandboxes piece and the Darktrace Signal Labs piece — hand-verified
        # live 2026-09-25 ~21:1x CDT via curl with a browser UA: HTTP 200,
        # pages load, content matches the competitor-watch citations).
        # The 404s are runner-egress IP reputation, not broken links.
        # tvgreport.com 522s automated fetchers (bot-block; article
        # hand-verified live 2026-09-20 via real browser — full article
        # loads, headline matches the competitor-watch citation).
        # boat.dev rejects automated fetchers (bot-block; pricing page
        # hand-verified live 2026-09-21 via real browser — rate card,
        # xlarge capacity-allocation caveat, and the E2B/Daytona $0.331/h
        # comparison table all match the competitor-watch citation).
        # producthunt.com 403s automated fetchers (bot-block; launch post
        # hand-verified live 2026-09-22 via real browser — page loads,
        # "automatic fallbacks across different providers" and the
        # multi-provider-strategy motivation match the C20 citation).
        # openai.com 403s automated fetchers (bot-block; the Agents API
        # launch post hand-verified live 2026-09-23 via real browser — the
        # mid-afternoon watch pass read the vendor's own post
        # (openai.com/index/introducing-the-agents-api: "Today, we're
        # introducing the Agents API in public beta," plus the nine named
        # sandbox partners; documented in issue #311), matching the C30
        # citation).
        # itbrief.com.au 403s automated fetchers on GitHub Actions runner
        # egress (bot-block; the Filestore agent volumes launch piece
        # hand-verified live 2026-09-23 ~17:06 CDT via real browser — full
        # article loads, launch framing, non-production-now/production-via-
        # allowlist, and the pay-per-use capacity + lifecycle-tiering
        # pricing all match the C36 THIRD-PARTY citation in the early-evening
        # watch pass). The author's own curls return 200 — the block is
        # runner-egress IP reputation, not a broken link.
        # itbrief.asia (same TechDay network as itbrief.com.au, different
        # TLD) 500s everything 2026-09-25 ~22:4x CDT — site-wide outage
        # ("Web application could not be started"; the homepage 500s too,
        # browser UA or not). The flagged Automaid story link passed CI on
        # the same docs ~40 min earlier (green on e3d872b), so this is a
        # site outage, not a broken link. The next watch turn should
        # confirm the page loads again and matches the citation.
        # cloud.google.com 403s automated fetchers on GitHub Actions runner
        # egress (bot-block; the Agent Substrate on GKE launch post
        # hand-verified live 2026-09-24 ~01:15 CDT via real browser — full
        # article loads; "Agent Substrate is open source and available to
        # all GKE customers for non-production workloads. GA support for
        # production is available via allowlist" matches the C36
        # VENDOR-VERIFIED citation in the midnight watch pass). The block
        # is runner-egress IP reputation, not a broken link.
        # automaid.it.com 522s / resets automated fetchers on GitHub Actions
        # runner egress (bot-block; the host sent lychee a 2-minute
        # rate-limit backoff on the 2026-09-24 ~01:15 CDT run). The own page
        # was hand-verified live 2026-09-23 ~23:56 CDT by the prior strategy
        # turn's surveyor read (the Automaid re-verification that closed the
        # lane-drift question) — the block is runner-egress IP reputation,
        # not a broken link.
        # epho.io resets automated fetchers on GitHub Actions runner egress
        # (bot-block; hand-verified live 2026-09-24 ~01:20 CDT via real
        # browser — full homepage loads, agents-as-API product framing
        # matches the competitor citations). Runner-egress IP reputation,
        # not a broken link.
        # www.wowza.com resets automated fetchers on GitHub Actions runner
        # egress (bot-block signature — connection reset, not 404/DNS; the
        # AV1 explainer link predates this change and passed CI on earlier
        # runs). NOT re-verified in a real browser this turn — the next
        # watch turn should confirm the page still loads and matches the
        # CODEC_LICENSING_RESEARCH citation.
        # termsquad.com 403s automated fetchers on GitHub Actions runner
        # egress (Cloudflare-fronted; deterministic CI failure — #385's
        # link-check failed twice in a row on the run that introduced the
        # termsquad.com/pricing link, fast-fail signature, not a timeout).
        # Real-browser verified live 2026-09-25 ~01:00 CDT (00:54 strategy
        # slot's surveyor): pricing page loads, Starter $9/mo (2 vCPU,
        # 4 GB RAM, 40 GB SSD NVMe) / Builder $19 / Power $29 / Ultra $49,
        # "AI subscriptions and usage are not included" still explicit —
        # matches the tracked-set citation. Runner-egress IP reputation,
        # not a broken link.
        # perplexity.ai 403s automated fetchers on GitHub Actions runner
        # egress (bot-block; the "Escaping SPACE: Part I" article page
        # hand-verified live 2026-09-25 ~14:10 CDT via real browser —
        # headline "Escaping SPACE: Part I", subtitle "Red-teaming VM
        # isolation and network confinement for AI agents", date
        # SEP 23, 2026, author Perplexity Secure Intelligence Institute —
        # matches the C54-adjacent citation in the mid-afternoon watch).
        # Runner-egress IP reputation, not a broken link.
        # dev.to 403s automated fetchers on GitHub Actions runner egress
        # (bot-block; flagged on #459's link-check — the near-midnight
        # competitor watch's dev.to roundup near-miss mention. Real-browser
        # verified live 2026-09-26 ~00:3x CDT: dev.to loads, and the author's
        # dev.to/alexcloudstar page carries "Sandboxing AI-Generated Code:
        # E2B vs Vercel Sandbox vs Modal vs Daytona in 2026" (May 1, 13 min
        # read, #ai #security #devtools #architecture) — matches the
        # near-miss citation). Runner-egress IP reputation, not a broken link.
        # red5.net 403s automated fetchers on GitHub Actions runner egress
        # (bot-block; the AV1 WebRTC streaming blog post hand-verified live
        # 2026-09-26 ~15:38 CDT via curl with a browser UA — HTTP 200, page
        # loads, matches the CODEC_LICENSING_RESEARCH citation).
        # Runner-egress IP reputation, not a broken link.
        # theregister.com 403s automated fetchers on GitHub Actions runner
        # egress (bot-block; the Cisco open-source H.264 stack article
        # hand-verified live 2026-09-26 ~15:38 CDT via curl with a browser
        # UA — 301 to a live page, HTTP 200, matches the
        # CODEC_LICENSING_RESEARCH citation). Runner-egress IP reputation,
        # not a broken link.
        # gamingonlinux.com 523s automated fetchers on GitHub Actions
        # runner egress (Cloudflare bot-block; the Sunshine Vulkan-encoding
        # article hand-verified live 2026-10-01 ~21:5x CDT via the text
        # browser — page loads, headline "Sunshine game streaming tool adds
        # Vulkan encoding plus XDG, Pipewire, and KWin direct screencast
        # capture" matches the REMOTE_DESKTOP_TRANSPORT_RESEARCH citation).
        # Runner-egress IP reputation, not a broken link.
        # web.archive.org throttles one specific snapshot URL with
        # 500/503s on automated fetches (2026-10-01 ~22:0x CDT: the
        # startuphub.ai 2026 sandbox-comparison snapshot
        # web/20260605034053/...; archive.org root and other snapshots
        # serve fine, so this is per-URL throttling, not a host block).
        # The underlying live article is verified HTTP 200 at its original
        # URL, so the citation is not broken — only the pinned snapshot
        # wrapper is throttled. Single-URL carve-out (not a host exclude):
        # if the snapshot itself ever dies, this exclusion must be
        # revisited, not silently kept.
        # pocketnews.com.my 403s/blocks automated fetchers on GitHub
        # Actions runner egress (bot-block; the Huawei Cloud CodeArts
        # Agent Malaysia launch article hand-verified live 2026-09-27
        # ~07:0x CDT via curl with a browser UA — HTTP 200, page loads,
        # title "Huawei Cloud Launches Enterprise AI Coding Tool
        # CodeArts Agent in Malaysia - Pocket News" matches the C67
        # THIRD-PARTY citation). Runner-egress IP reputation,
        # not a broken link.
        # www.huawei.com 403s/blocks automated fetchers on GitHub Actions
        # runner egress (bot-block; the Huawei Cloud CodeArts Agent
        # Malaysia commercial-launch press release hand-verified live
        # 2026-09-27 ~07:2x CDT via real browser — HTTP 200, title
        # "Huawei Cloud Unveils CodeArts Agent for Enterprise-grade AI
        # Coding in Malaysia", Sep-18 dateline, and the CodeArts Agent
        # commercial-launch claims all match the C67
        # FIRST-PARTY-CORROBORATED citation in the midday watch pass).
        # Runner-egress IP reputation, not a broken link.
        # cdm.link 403s automated fetchers on GitHub Actions runner egress
        # (bot-block; the MPEG LA H.264 royalty-free-license editorial
        # hand-verified live 2026-09-27 ~19:05 CDT via real browser fetch —
        # the site answers with a CrowdSec captcha challenge, i.e. the host
        # is live and bot-blocking, not a dead link; the flagged URL is the
        # CODEC_LICENSING_RESEARCH citation). Runner-egress IP reputation,
        # not a broken link.
        # lifestyle.thepointnews.com 403s automated fetchers (bot-block;
        # the Guava "Daytona" voice-model press-release page hand-verified
        # live 2026-09-29 ~03:2x CDT via real browser — full article loads,
        # headline "Guava Launches Daytona, a State of the Art Voice Model,
        # alongside an Open Benchmark Evaluating Voice Agent Performance"
        # matches the Sep-24 evening watch citation; lychee 403s the same
        # URL from two independent egresses, and it passed CI ~35 min
        # earlier on #666 — newly bot-blocking, not a dead link).
        # Runner-egress IP reputation, not a broken link.
        # lifestyle.independent.mk 403s automated fetchers (bot-block; the
        # TermSquad launch press-release page hand-verified live 2026-09-30
        # ~09:35 CDT via real browser — full article loads, headline
        # "TermSquad Launches an Always-On Cloud Computer for AI Coding
        # Agents" + EIN Presswire body match the
        # RESEARCH_AGENT_SANDBOX_ADOPTION.md citation; lychee 403s it from
        # GitHub egress and curl 403s it from the loop's egress too, while
        # this PR's round-1 head passed the same check ~10 min earlier with
        # no URL changes in between — newly bot-blocking, not a dead link).
        # Excluded at host level (not per-URL): new links
        # from these hosts trip the same bot blocks, so the exclusion must
        # cover the whole host. When adding a link from one of these hosts,
        # open it in a real browser and confirm the page loads and matches
        # the cited headline; a browser 404 means the link is genuinely
        # broken — fix the link, don't extend the exclusion.
        # BACKSLASH NOTE: this string is YAML double-quoted, so the two-char `\\`
        # in this file reaches the action as a single `\`; the action evals
        # its args through bash single quotes (which pass backslashes
        # through literally), so lychee finally sees `\.` (regex: literal
        # dot). Do NOT "fix" these to `\\\\` — that
        # makes the regex demand a literal backslash and silently disables
        # all eight excludes. (Backslash counts are easy to misread through
        # tool display escaping — verify with `od -c`, not by eye.)
        # Ritual compare links (github.com/ntindle/spark-vm/compare/...) are
        # excluded: the release ritual (docs/VERSIONING.md) writes them at
        # bump time pointing at the tag the release workflow cuts AFTER merge,
        # so they 404 by design until the release lands. They are
        # machine-generated from the ritual's fixed pattern, so a typo there
        # is near-impossible and excluding them hides no real link.
        # e2b.dev, agentcomputer.ai, boxd.sh, and docs.docker.com block
        # automated fetchers on GitHub Actions runner egress (bot-block; all
        # four hand-verified live 2026-09-26 ~17:15 CDT via real browser
        # fetch — e2b.dev/pricing loads the full pricing page, boxd.sh loads
        # the homepage, agentcomputer.ai/pricing loads the pricing table,
        # docs.docker.com/ai/sandboxes/release-notes/ loads the release
        # notes — the lychee errors are runner-egress IP reputation, not
        # broken links). CI on #504 failed the markdown link check twice on
        # these (2026-09-26); main was green ~40 min earlier with no URL
        # changes in between, so this is a newly bot-blocking egress, not
        # a docs regression.
        # SHA-pinned (e7477775783ea5526144ba13e8db5eec57747ce8, v2.9.0) so a
        # tag drift can't widen what this step can do.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: "--no-progress --exclude-loopback --exclude 'https?://github\\.com/ntindle/spark-vm/compare/.*' --exclude 'https?://(www\\.)?medium\\.com/.*' --exclude 'https?://(www\\.)?businesswire\\.com/.*' --exclude 'https?://(www\\.)?globenewswire\\.com/.*' --exclude 'https?://(www\\.)?daytona\\.io/.*' --exclude 'https?://(www\\.)?fourweekmba\\.com/.*' --exclude 'https?://(www\\.)?tvgreport\\.com/.*' --exclude 'https?://([a-z0-9-]+\\.)?boat\\.dev/.*' --exclude 'https?://(www\\.)?producthunt\\.com/.*' --exclude 'https?://(www\\.)?openai\\.com/.*' --exclude 'https?://(www\\.)?itbrief\\.com\\.au/.*' --exclude 'https?://(www\\.)?itbrief\\.asia/.*' --exclude 'https?://cloud\\.google\\.com/.*' --exclude 'https?://automaid\\.it\\.com/.*' --exclude 'https?://(www\\.)?epho\\.io/.*' --exclude 'https?://(www\\.)?wowza\\.com/.*' --exclude 'https?://(www\\.)?termsquad\\.com/.*' --exclude 'https?://([a-z0-9-]+\\.)?perplexity\\.ai/.*' --exclude 'https?://(www\\.)?dev\\.to/.*' --exclude 'https?://(www\\.)?mactech\\.com/.*' --exclude 'https?://(www\\.)?financialcontent\\.com/.*' --exclude 'https?://([a-z0-9-]+\\.)?marketminute\\.com/.*' --exclude 'https?://(www\\.)?red5\\.net/.*' --exclude 'https?://(www\\.)?theregister\\.com/.*' --exclude 'https?://(www\\.)?pocketnews\\.com\\.my/.*' --exclude 'https?://(www\\.)?gamingonlinux\\.com/.*' --exclude 'https?://web\\.archive\\.org/web/20260605034053/https://www\\.startuphub\\.ai/ai-news/artificial-intelligence/2026/daytona-vs-e2b-vs-modal-vs-vercel-sandbox-2026' --exclude 'https?://(www\\.)?huawei\\.com/.*' --exclude 'https?://e2b\\.dev/.*' --exclude 'https?://(www\\.)?agentcomputer\\.ai/.*' --exclude 'https?://boxd\\.sh/.*' --exclude 'https?://docs\\.docker\\.com/.*' --exclude 'https?://(www\\.)?cdm\\.link/.*' --exclude 'https?://(www\\.)?lifestyle\\.thepointnews\\.com/.*' --exclude 'https?://lifestyle\\.independent\\.mk/.*' '**/*.md'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  png-check:
    name: PNG screenshot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          # --with-deps installs OS deps itself (escalates internally); a sudo
          # install-deps line would fail since root's Python lacks the runner
          # user's site-packages.
          python3 -m playwright install --with-deps chromium
      - name: Screenshot + validate PNG signature
        run: |
          rm -f /tmp/pw-test.png  # stale screenshot must not mask a pw-test failure
          python3 scripts/pw-test.py
          python3 scripts/png-check.py
