# spark-vm CI: python tests (gated to code changes — P138), shellcheck, markdown
# link check, changelog ritual lint, docs index coverage, PNG smoke test.
# The changed-paths gate skips the ~40-min python suite on docs-only diffs;
# shellcheck, link check, changelog lint, docs-guard, and PNG are the
# docs-only merge gate.
#
# Run locally with (from the repo root — the one-liner in CONTRIBUTING.md):
#   python3 -m pytest
# (`pytest.ini` testpaths enumerate every suite; CI runs exactly this, so a
# suite can never land unwired the way the old per-directory lists allowed.)
#   # the two seteuid install-safety tests self-skip as non-root; CI runs them under sudo:
#   sudo SAFE_INSTALL_ROOT_TESTS=require "$(command -v python3)" -m pytest proxy/test_safe_install.py -k 'unreachable_by_parent_dir_attacker or staging_dir_swap_fails_closed' -q
#   python3 scripts/lint-changelog-ritual.py  # changelog ritual lint (enforced as a CI job too)

name: ci

# Least privilege: this workflow only reads the repo and reports status.
# Runs on push to main, where a compromised third-party action with a
# writable token could otherwise touch a tree that auto-deploys sudoers
# files, a CA bundle, and the credential-swapping proxy.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Path gate for the expensive jobs (P138 / F453: the ~40-min full python
  # suite used to gate even docs-only PRs). Computes `code_changed`: true
  # when the PR touches any file outside docs/ + CHANGELOG.md. The cheap,
  # always-run jobs below are the docs-only merge gate; python-tests is
  # skipped for docs-only diffs. No new dependency: one-step
  # `git diff --name-only` against the PR base (fetch-depth 0 so the base
  # is available). On push/workflow_dispatch the diff is meaningless, so
  # code_changed defaults true and everything runs.
  changes:
    name: changed-paths gate
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: compute changed paths
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            # --no-renames: a rename is reported by destination name only,
            # so a scripts/x.py -> docs/x.md rename would look docs-only
            # and skip the suite while deleting real code. As delete+add
            # the old path trips the case below and the suite runs.
            files=$(git diff --no-renames --name-only "$base"...HEAD)
          else
            files="push"
          fi
          code_changed=true
          if [ "$files" != "push" ]; then
            code_changed=false
            while IFS= read -r f; do
              case "$f" in
                docs/*|CHANGELOG.md) ;;
                # NB: an empty diff feeds the loop one empty line, which
                # matches *) — so a zero-change diff fails closed to
                # code_changed=true and the suite runs. That is the safe
                # direction; keep it.
                *) code_changed=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  # #1138: shard the ~40-min python suite into parallel jobs. The `plan`
  # job emits the shard inventory from scripts/ci_shard_plan.py as the
  # matrix for `python-tests-shard` (one matrix child per shard); the
  # `python-tests` job below is the aggregate gate over all shards and
  # keeps the exact `python tests` check name the branch-protection
  # ruleset requires — no ruleset update needed, and the gate cannot go
  # green while any shard is red.
  plan:
    name: shard plan
    needs: changes
    # P138: docs-only diffs skip the suite entirely, so the plan has
    # nothing to emit for them.
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check shard inventory
        # The bijection pin test (scripts/test_ci_shard_plan.py) runs
        # INSIDE the shard-unit shard, so a PR that drops scripts/ from
        # the inventory would unwire the pin from its own CI run and go
        # green with suites silently never running. Enforce the bijection
        # here too: the plan job always runs on code PRs, and a failure
        # here fails the aggregate gate via plan=failure.
        run: python3 scripts/ci_shard_plan.py --check
      - name: emit shard matrix
        id: shards
        run: |
          matrix="$(python3 scripts/ci_shard_plan.py)"
          # Fail loud on a broken plan: an empty matrix would fan out to
          # zero children and the gate below would see "all skipped".
          echo "$matrix" | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['include'], 'empty shard matrix'"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  python-tests-shard:
    name: python tests (${{ matrix.shard }})
    needs: [changes, plan]
    # P138: docs-only diffs skip the ~40-min suite; the docs-only gate is
    # the four other jobs plus the docs-index coverage guard (docs-guard).
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One shard's failure must not cancel the others: the aggregate gate
      # needs every shard's own verdict, and a cancelled shard must not
      # read as anything but a gate failure.
      fail-fast: false
      # NB: the strategy expression is evaluated BEFORE the job-level `if:`
      # below, so on docs-only diffs (where `plan` is skipped and its
      # output is empty) a bare fromJson(needs.plan.outputs.matrix) would
      # throw "empty input" and FAIL the job instead of skipping it —
      # blocking the docs-only PRs P138 keeps mergeable. The `||` fallback
      # yields a zero-leg matrix on empty input, so the job skips cleanly
      # and the aggregate's docs-only carve-out works as designed. (Empty
      # string is falsy in GHA expressions; a successful plan always emits
      # non-empty JSON, so the fallback never fires on a code PR.)
      matrix: ${{ fromJson(needs.plan.outputs.matrix || '{"include":[]}') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The merge gate proves exactly what a contributor runs locally
      # (CONTRIBUTING.md "Running the tests"): requirements-test.txt is the
      # whole dependency set — pytest, cryptography (confirm/push.py's Web
      # Push tests), pillow (waitlist page og:image assertions). mitmproxy
      # is a *deploy* dependency, never imported by a test module.
      - name: install test dependencies
        run: pip install -r requirements-test.txt
      # cua/test_shell_scripts.py gates on shellcheck warnings; pin it
      # explicitly rather than relying on the runner image carrying it.
      # (2026-09-18: the runner-preinstalled shellcheck caught 5 warnings the
      # PR author could not reproduce locally — the gate must be deterministic.)
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shard test suite
        # pytest.ini testpaths enumerate every suite; the shard inventory in
        # scripts/ci_shard_plan.py partitions them, and
        # scripts/test_ci_shard_plan.py (running in the shard-unit child)
        # pins the bijection — so this step can never silently drop a suite
        # the way the old per-directory file lists did (~two dozen suites
        # landed unwired before 2026-09-27). pytest continues past a failing
        # suite and reports every failure at the end, so one red suite
        # cannot mask another.
        # if: always(): never let an infra flake in an earlier setup step
        # (shellcheck's apt-get, pip) skip the whole suite and void the
        # merge gate's test signal.
        if: always()
        run: python3 -m pytest -q ${{ matrix.dirs }}
      - name: proxy install-safety root tests (substitution regression)
        # test_staged_temp_unreachable_by_parent_dir_attacker and
        # test_staging_dir_swap_fails_closed self-skip as non-root, so the
        # shard run above never executes the staged-temp substitution TOCTOU
        # guard (issue #336). Run them under sudo so the merge gate proves
        # the guard; SAFE_INSTALL_ROOT_TESTS=require turns a self-skip into
        # a failure, so a skipped test can never read as a green build.
        # (Pytest exits 5 if the -k selection ever matches nothing, e.g.
        # after a rename -- also a failure.)
        # matrix.root_tests is data-driven from scripts/ci_shard_plan.py
        # (exactly the shard holding proxy/) — never a hardcoded shard name,
        # so renaming a shard cannot silently drop these tests.
        if: always() && matrix.root_tests
        # NB: sudo resets PATH to secure_path, so bare `python3` would resolve
        # to /usr/bin/python3 (no pytest) -- that failed the CI step with
        # "No module named pytest". Resolve the setup-python interpreter OUTSIDE
        # sudo (setup-python puts it first on PATH) and pass it as an absolute
        # path; sudo's VAR=value form still carries SAFE_INSTALL_ROOT_TESTS.
        run: sudo SAFE_INSTALL_ROOT_TESTS=require "$(command -v python3)" -m pytest proxy/test_safe_install.py -k 'unreachable_by_parent_dir_attacker or staging_dir_swap_fails_closed' -q

  python-tests:
    name: python tests
    # The aggregate gate. Branch-protection ruleset 23971329 requires the
    # `python tests` context by name, so this job keeps that exact name and
    # the shard children (`python tests (<shard>)`) stay unrequired: the
    # ruleset needs no update and the gate is not weakened.
    needs: [changes, plan, python-tests-shard]
    # if: always(): without it, a failed/cancelled shard would SKIP this
    # job, and a skipped required check shows neutral — the PR could merge
    # on red shards. With it, this job always runs and the step below
    # decides the verdict explicitly.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: gate on shard results
        run: |
          changes_result="${{ needs.changes.result }}"
          plan_result="${{ needs.plan.result }}"
          shard_result="${{ needs.python-tests-shard.result }}"
          if [ "$changes_result" = "success" ] && [ "$plan_result" = "skipped" ] && [ "$shard_result" = "skipped" ]; then
            # Docs-only path (P138): plan's `if` is exactly the code_changed
            # gate, so given changes=success, plan-skipped ⟺ docs-only —
            # the shards never ran, same as today's skipped check: neutral,
            # not a failure.
            exit 0
          fi
          if [ "$plan_result" = "success" ] && [ "$shard_result" = "success" ]; then
            exit 0
          fi
          # Every other combination fails the gate: a failed/cancelled plan
          # (shards skipped via needs), a failed/cancelled shard, or a
          # failed changes job can never read as green.
          echo "failing the gate: changes=$changes_result plan=$plan_result shards=$shard_result" >&2
          exit 1

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all shell scripts
        # pinned SHA: action unmaintained since 2024, SHA protects against
        # branch drift (00b27aa7cb85167568cb48a3838b75f4265f2bca, 2024-06-20)
        # severity=error gates on real breakage (syntax/misuse), not style notes
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          severity: error

  changelog-ritual:
    name: changelog ritual lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Enforces CHANGELOG.md's own ritual (rules 1 + 4): entries must not
      # reference workspace-internal paths (agent_notes/, hidden_files/,
      # workspace/goals/) that never exist in a reader's checkout. The
      # ritual preamble that documents the rule is exempt (see the script).
      - name: lint changelog for workspace-internal path references
        run: python3 scripts/lint-changelog-ritual.py

  docs-guard:
    name: docs index coverage
    # Always runs, even on docs-only diffs where python-tests is skipped
    # (P138): scripts/test_docs_index_coverage.py lives in the python suite,
    # so without this carve-out a new docs/*.md file without an index row
    # would land with the coverage invariant unwatched. The doc-inventory
    # pins ride the same carve-out: test_ci_md_link_excludes.py and
    # test_contributing_ci_gates.py compare doc claims against CI sources
    # of truth, and a docs-only PR hand-editing those inventory blocks
    # would otherwise land with the guard skipped. All three are
    # stdlib-only, so the pytest-only install below suffices.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The test imports only stdlib (os, re), but pytest itself is not on
      # the runner image — install just it (not the whole requirements-test
      # set, which this test never needs).
      - name: install pytest
        run: pip install pytest
      - name: docs-index coverage + doc-inventory pins
        run: python3 -m pytest scripts/test_docs_index_coverage.py scripts/test_ci_md_link_excludes.py scripts/test_contributing_ci_gates.py -q

  markdown-links:
    name: markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in all markdown docs
        # --exclude-mail was removed upstream (lychee >= 0.20 excludes mail by
        # default); passing it fails the step with "unexpected argument".
        # --exclude-loopback: docs reference localhost service addresses
        # (cred-ui, proxy) that can never resolve on a CI runner.
        # Bot-blocking hosts: medium.com 403s every automated fetcher
        # (2026-09-19, CI on #39); www.daytona.io 403s automated fetchers too
        # (bot-block; security exhibit page hand-verified live 2026-09-20,
        # quoted text matches verbatim). businesswire.com / globenewswire.com reject
        # lychee's HTTP client (HTTP/2 protocol errors) — the flagged URLs
        # were all hand-verified live that day, so these are false positives,
        # not broken links. fourweekmba.com 403s automated fetchers (bot-block;
        # page hand-verified live 2026-09-20 via real browser — full article
        # loads, headline matches the midday watch's Agents API citation).
        # mactech.com 500s automated fetchers on GitHub Actions runner
        # egress (bot-block; the MPEG LA H.264 royalty-free article
        # hand-verified live 2026-09-25 ~21:0x CDT via curl — HTTP 200,
        # page loads, matches the codec-licensing diligence citation).
        # The 500 is runner-egress IP reputation, not a broken link.
        # financialcontent.com and marketminute.com (GlobeNewswire press-release
        # syndication hosts) 404 lychee on GitHub Actions runner egress
        # (bot-block; both flagged articles — the 2026-09-24 Docker cloud
        # sandboxes piece and the Darktrace Signal Labs piece — hand-verified
        # live 2026-09-25 ~21:1x CDT via curl with a browser UA: HTTP 200,
        # pages load, content matches the competitor-watch citations).
        # The 404s are runner-egress IP reputation, not broken links.
        # tvgreport.com 522s automated fetchers (bot-block; article
        # hand-verified live 2026-09-20 via real browser — full article
        # loads, headline matches the competitor-watch citation).
        # boat.dev rejects automated fetchers (bot-block; pricing page
        # hand-verified live 2026-09-21 via real browser — rate card,
        # xlarge capacity-allocation caveat, and the E2B/Daytona $0.331/h
        # comparison table all match the competitor-watch citation).
        # producthunt.com 403s automated fetchers (bot-block; launch post
        # hand-verified live 2026-09-22 via real browser — page loads,
        # "automatic fallbacks across different providers" and the
        # multi-provider-strategy motivation match the C20 citation).
        # openai.com 403s automated fetchers (bot-block; the Agents API
        # launch post hand-verified live 2026-09-23 via real browser — the
        # mid-afternoon watch pass read the vendor's own post
        # (openai.com/index/introducing-the-agents-api: "Today, we're
