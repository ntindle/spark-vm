# Release-health monitor: tag <-> release consistency + golden-image gate
# verdicts on the published surface.
#
# Why this exists (distribution, open-source track): the release pipeline
# (scripts/cut-release.sh + release.yml) cuts an immutable v* tag and
# publishes a GitHub release for it. release.yml's in-run recovery covers
# the tag-pushed / publish-failed class (GitHub #659) *inside the run*, but
# anything that fails outside that window — a hand-pushed tag, a failed
# recovery, a publish that silently never happened — drifts silently. This
# scheduled check fails loudly on that drift so the release surface the
# project advertises is the surface GitHub actually publishes.
#
# The same run also reads the golden-image build gate verdict per published
# release: a published release whose gate never passed (the v0.9.0 cut
# shipped exactly this way) is drift the tag/release check cannot see.
#
# Read-only: no tags are created, no releases are published, no workflows
# are dispatched, no mutations. The GITHUB_TOKEN below raises the API quota
# (the gate check reads workflow runs, so it needs actions:read; without
# it the script fails loud, never silently passes). The token is never
# logged.

name: release-health

on:
  schedule:
    # Daily, 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # release_health.py reads release.yml workflow runs for the gate verdicts

jobs:
  release-health:
    name: tag/release consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15 # network-bound (git ls-remote + Releases API), healthy < 2 min
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA-pinned
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, SHA-pinned
        with:
          python-version: "3.12"
      # pytest itself is not on the runner image — install just it (the
      # monitor and its tests are stdlib-only otherwise).
      - name: install pytest
        run: pip install pytest
      - name: Self-check the monitor
        run: python3 -m pytest scripts/test_release_health.py -q
      - name: Check release health
        run: python3 scripts/release_health.py
