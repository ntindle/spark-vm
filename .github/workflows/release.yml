# Cut a GitHub release whenever VERSION changes on main.
#
# The release itself is cut by scripts/cut-release.sh (preflight checks,
# release-notes assembly, immutable tag, published release). This workflow
# only decides *when*: a push to main that touches VERSION, or a manual
# dispatch. The concurrency group serializes workflow runs; a run whose
# bump was superseded by a newer push fails the script's in-sync preflight
# by design — only the latest VERSION is ever released.

name: Cut release

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release tag + publish the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA-pinned
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Cut release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/cut-release.sh --ci
