# Cut a GitHub release whenever VERSION changes on main.
#
# The release itself is cut by scripts/cut-release.sh (preflight checks,
# release-notes assembly, immutable tag, published release). This workflow
# only decides *when*: a push to main that touches VERSION, or a manual
# dispatch. The concurrency group serializes workflow runs. A run whose
# bump was superseded while still queued fails the script's in-sync
# preflight by design; a run already past its fetch when the newer push
# lands completes and publishes, then the newer run publishes next — both
# releases happen, in push order. The same run also calls the golden-image
# build gate (workflow_call) after publishing: the tag push uses
# GITHUB_TOKEN, which never triggers workflow runs, so the gate's own
# `push: tags` trigger cannot fire on a real release (#1176). The gate
# also runs when the recovery path publishes the release (cut failed,
# recovery succeeded) — the tag step emits on cut-success OR
# recovery-success and the gate job runs whenever that output is non-empty,
# so a total failure (no release published) is the only path that skips
# the gate.

name: Cut release

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# If the cut step pushed the tag but publishing failed (the v0.5.0 cut,
# GitHub #659), the recovery step below publishes the release for the
# existing tag via --publish-only. It fail-closes when there is nothing to
# recover (tag missing locally → clean die), so a pre-publish failure
# stays a clear failure with diagnostics instead of a silent half-release.

permissions:
  contents: write # push the release tag + publish the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      # The exact tag the cut published (or the recovery step published).
      # The gate job consumes this as its build target — never re-derived
      # from main's tip, which may already be past the release commit when
      # a second release bump is queued behind the concurrency group.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, SHA-pinned
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Configure git identity for tagging
        # actions/checkout sets up auth but no user.name/user.email, and
        # `git tag -a` embeds a tagger identity — without this the release
        # step dies on "Committer identity unknown" on every automated run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cut release
        id: cut
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/cut-release.sh --ci
      - name: Recover tag-pushed / publish-failed state
        id: recover
        # GitHub #659: the v0.5.0 cut pushed its tag but the publish step
        # failed. If this step ever runs (the cut step failed), publish the
        # release for the existing tag — --publish-only regenerates the
        # notes and fail-closes when the tag is missing or the release
        # already exists, so the job's verdict stays accurate either way.
        # --ci: the checkout is detached (actions/checkout), so the
        # GITHUB_REF check applies instead of the attached-branch check.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/cut-release.sh --publish-only --yes --ci
      - name: Expose the cut release tag
        # Emitted when the release actually got published: the cut
        # published it, or the cut failed and the recovery step published
        # it for the tag-pushed/publish-failed state (GitHub #659). In
        # both paths the checkout is the per-run commit (preflight-guarded
        # by cut-release.sh), so v$(cat VERSION) is exactly the tag that
        # was just published. Both-failed means no release exists, so no
        # tag is emitted and the gate stays skipped: emitting a tag there
        # would point the golden-image gate at a release that was never
        # published (and a superseded-run preflight failure is routine,
        # not a release).
        # The condition needs always(): the cut step failed in the recovery
        # path, so without it this step (implicit success()) would be
        # skipped and the gate would never run on the releases that most
        # needed operator-visible recovery.
        id: tag
        if: always() && (steps.cut.outcome == 'success' || steps.recover.outcome == 'success')
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

  golden-image:
    # The #1087 F-P1 gate, run in the same workflow run as the release:
    # the tag push above uses GITHUB_TOKEN, which never triggers workflow
    # runs, so the gate's own `push: tags: ["v*"]` trigger cannot fire on
    # a real release (#1176). The called workflow checks out the exact
    # release tag itself (v$(cat VERSION)); it needs no secrets and never
    # pushes (contents: read, build-only).
    #
    # The gate runs on every published release — including the recovery
    # path, where the release job is red because the cut failed but the
    # recovery step published the release anyway. Without always() the
    # gate would silently skip exactly the releases that needed
    # operator-visible recovery; the output check keeps it skipped on a
    # total failure, where no release exists to gate.
    name: golden-image build gate
    needs: release
    if: always() && needs.release.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/golden-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
