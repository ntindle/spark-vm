[pytest]
# Single test command for the whole repo: `python3 -m pytest` from the repo
# root. Suites live one per component directory; no __init__.py files are
# used, so pytest imports each test module by basename — keep test file
# basenames unique across the repo (see CONTRIBUTING.md "Running the tests").
testpaths =
    proxy
    confirm
    muse-job/tests
    deploy
    scripts
    cred-ui/tests
    provision
python_files = test_*.py
