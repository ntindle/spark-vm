[pytest]
# Single test command for the whole repo: `python3 -m pytest` from the repo
# root. Suites live one per component directory; no __init__.py files are
# used, so pytest imports each test module by basename — keep test file
# basenames unique across the repo (see CONTRIBUTING.md "Running the tests").
# Exception: browser-driver/bdrive/ ships an __init__.py — the protocol is
# a real importable package (the future daemon will `import bdrive`), and
# pytest importing the suite as bdrive.test_bdrive_protocol *reduces*
# basename-collision risk. Do not "clean it up".
testpaths =
    proxy
    confirm
    muse-job/tests
    deploy
    scripts
    cred-ui/tests
    harness
    browser-driver
    cua
    jail
python_files = test_*.py
markers =
    needs_clean_checkout: test shells out to a script that refuses on a dirty checkout
