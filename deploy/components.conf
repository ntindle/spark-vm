# deploy/components.conf — deployable-component manifest for auto-deploy.sh.
#
# This file is sourced by deploy/auto-deploy.sh (bash). It is the single place
# that says "repo path X is deployed as service Y with gate Z and health check H".
#
# Per component <c>, define:
#   <c>_paths          (array) repo path prefixes (trailing slash for dirs)
#   <c>_services       (array) systemd SYSTEM units restarted on change
#   <c>_user_services  (array) systemd USER units restarted on change
#   <c>_tests          (string) gate command, run from the repo root before any install
#   <c>_health         (array) "tcp:HOST:PORT" checks after restart
#   <c>_install_paths  (array) files outside the repo that a deploy writes;
#                      snapshotted before install so rollback can restore them.
#                      May reference $SWAPD_HOME, $BIN_DIR, $SYSTEMD_DIR.
#
# A repo path that matches no component is *pull-only*: the watermark advances
# past it but nothing is installed or restarted.

COMPONENTS=(proxy confirm cred-ui)

# --- proxy: swap proxy + inference proxy (swap_addon.py, grant writers) ---
proxy_paths=("proxy/")
proxy_services=("swap-proxy.service" "swap-inference.service")
proxy_user_services=()
proxy_tests="python3 -m pytest proxy/test_swap_addon.py proxy/test_grant_writer.py proxy/test_round6.py -q"
proxy_health=("tcp:127.0.0.1:18080" "tcp:127.0.0.1:18081")
proxy_install_paths=(
    "$SWAPD_HOME/swap_addon.py"
    "$SWAPD_HOME/grant-writer"
    "$SWAPD_HOME/ssrf.deny"
    "$BIN_DIR/cred-grant-revoke"
    "$BIN_DIR/cred-registry-set"
    "$BIN_DIR/cred-registry-set-inference"
    "$BIN_DIR/cred-store-set"
    "$BIN_DIR/cred-store-set-inference"
    "$BIN_DIR/cred-store-get"
    "$BIN_DIR/cred-store-delete"
    "$BIN_DIR/with-proxy"
    "$SYSTEMD_DIR/swap-proxy.service"
    "$SYSTEMD_DIR/swap-inference.service"
)

# --- confirm: confirmd approvals page + confirm-request CLI ---
confirm_paths=("confirm/")
confirm_services=("confirmd.service")
confirm_user_services=()
confirm_tests="python3 -m pytest confirm/test_confirmd.py -q"
confirm_health=("tcp:100.65.241.20:8443")
confirm_install_paths=(
    "$SWAPD_HOME/confirmd.py"
    "$BIN_DIR/confirm-request"
    "$SYSTEMD_DIR/confirmd.service"
)

# --- cred-ui: localhost-only credential management web UI ---
# Runs from the checkout as a systemd USER unit, so there is no install step:
# deploy = pull + restart. The UI never serves secrets; it only writes via the
# narrow sudo writers.
cred_ui_paths=("cred-ui/")
cred_ui_services=()
cred_ui_user_services=("cred-ui.service")
cred_ui_tests="python3 -m py_compile cred-ui/cred-ui.py"
cred_ui_health=("tcp:127.0.0.1:18740")
# Empty: the user unit is enabled from the checkout and the UI runs from the
# checkout, so a deploy writes no files outside the repo.
cred_ui_install_paths=()
