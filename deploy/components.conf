# deploy/components.conf — deployable-component manifest for auto-deploy.sh.
#
# This file is sourced by deploy/auto-deploy.sh (bash). It is the single place
# that says "repo path X is deployed as service Y with gate Z and health check H".
#
# Per component <c>, define:
#   <c>_paths          (array) repo path prefixes (trailing slash for dirs)
#   <c>_services       (array) systemd SYSTEM units restarted on change
#   <c>_user_services  (array) systemd USER units restarted on change
#   <c>_tests          (string) gate command, eval'd from the mirror repo root
#                              BEFORE any install; empty fails closed
#   <c>_health         (array) "tcp:HOST:PORT" checks after restart
#   <c>_install        (string) install command, eval'd from the mirror repo
#                              root; empty = no install step (restart-only).
#                              The command owns its own privilege (deploy.sh
#                              uses sudo internally).
#   <c>_install_unit   (string, optional) components sharing a value deploy as
#                              one unit: if any member changed, all members are
#                              gated, snapshotted, restarted, and health-checked.
#   <c>_checkout_sync  (string, optional) repo subtree synced from the mirror
#                              at the deployed commit into $WORKING_CHECKOUT
#                              (fails closed on uncommitted changes there).
#   <c>_install_paths  (array) files outside the repo that a deploy writes;
#                      snapshotted before install so rollback can restore them.
#                      May reference $SWAPD_HOME, $BIN_DIR, $SYSTEMD_DIR, or be
#                      literal absolute paths (e.g. /etc/sudoers.d files).
#
# A repo path that matches no component is *pull-only*: the watermark advances
# past it but nothing is installed or restarted.
#
# NOTE: the timer runs the INSTALLED copy of this file
# ($UPDATER_STATE_DIR/bin/components.conf), refreshed by `auto-deploy.sh init`.
# Merging a change to this file does NOT take effect until init is re-run.

COMPONENTS=(proxy confirm cred-ui)

# --- proxy: swap proxy + inference proxy (swap_addon.py, grant writers) ---
# VERSION is claimed here as an exact-file path (not a directory prefix):
# a version-only bump redeploys the proxy-confirm unit so the deployed
# standalone files pick up the new VERSION. Bare (non-slash) entries match
# that file only — docs/VERSIONING.md and any other top-level VERSION* path
# do NOT trigger a deploy.
proxy_paths=("proxy/" "VERSION")
proxy_services=("swap-proxy.service" "swap-inference.service")
proxy_user_services=()
# Issue #302: host-side (non-repo) inputs for change detection. The
# git-diff mapping that names changed components cannot see files that live
# on the box but not in the repo — a mitmproxy CA rotation (or a first-run
# CA generation) with no concurrent code change must still redeploy the
# proxy so step 4b of proxy/deploy.sh rebuilds the CA bundle. auto-deploy.sh
# hashes these paths on every deploy tick and treats a digest change as a
# proxy change; the digest is recorded in the state dir on each successful
# proxy deploy. Uses $SWAPD_HOME so tests can redirect it (issue #108).
proxy_extra_paths=("$SWAPD_HOME/.mitmproxy/mitmproxy-ca-cert.pem")
# The gate is the last check before root-adjacent installs: it must cover
# every test module in the component, not just the ones that existed when
# the manifest was first written (arch review 2026-09-23: four proxy test
# files had silently drifted out of the gate — see test_auto_deploy.py's
# gate-coverage tripwire, which pins this list against the directory).
proxy_tests="python3 -m pytest proxy/test_swap_addon.py proxy/test_grant_writer.py proxy/test_round6.py proxy/test_safe_install.py proxy/test_build_ca_bundle.py proxy/test_privileged_read.py proxy/test_enforce_secrets_dir.py proxy/test_validation_conformance.py proxy/test_summons_outbox.py -q"
proxy_health=("tcp:127.0.0.1:18080" "tcp:127.0.0.1:18081")
proxy_install="bash proxy/deploy.sh --no-restart"
proxy_install_unit="proxy-confirm"
proxy_checkout_sync=""
# Literal system paths below are overridable by env so the deploy tests can
# redirect them at tmp instead of touching the host (issue #108: on a
# deployed box /etc/sudoers.d/swapd exists but is unreadable by the test
# user, and snapshot's `cp -a` dies in Permission denied). Production never
# sets these; defaults are the live paths. Follows the existing
# $SWAPD_HOME/$BIN_DIR/$SYSTEMD_DIR indirection for the other entries.
: "${SUDOERS_D_SWAPD:=/etc/sudoers.d/swapd}"
: "${WITH_PROXY_CA_BUNDLE:=/usr/local/share/with-proxy-ca/ca-bundle.crt}"
# Issue #303: export so the value propagates into the child shell that runs
# proxy/deploy.sh — without this, a set-but-not-exported override would make
# snapshot/rollback cover the override path while deploy.sh wrote the
# default (split-brain coverage). Production never sets it; the default is
# what both paths see unless the operator exports an override.
export WITH_PROXY_CA_BUNDLE
: "${LOGROTATE_SWAP_PROXY:=/etc/logrotate.d/swap-proxy}"
proxy_install_paths=(
    "$SWAPD_HOME/swap_addon.py"
    "$SWAPD_HOME/grant-writer"
    "$SWAPD_HOME/ssrf.deny"
    # Version stamping (docs/VERSIONING.md): VERSION + the reader the
    # deployed standalone files use to resolve it.
    "$SWAPD_HOME/VERSION"
    "$SWAPD_HOME/sparkvm_version.py"
    # proxy/deploy.sh also writes these on every run (Security review,
    # rollback coverage): the sudoers file is the highest-privilege artifact
    # in the deploy — it must be restorable on rollback too.
    "$SWAPD_HOME/grants.json"
    "$SUDOERS_D_SWAPD"
    "$WITH_PROXY_CA_BUNDLE"
    "$LOGROTATE_SWAP_PROXY"
    "$BIN_DIR/cred-grant-revoke"
    "$BIN_DIR/cred-registry-set"
    "$BIN_DIR/cred-registry-set-inference"
    "$BIN_DIR/cred-store-set"
    "$BIN_DIR/cred-store-set-inference"
    "$BIN_DIR/cred-store-get"
    "$BIN_DIR/cred-store-delete"
    "$BIN_DIR/with-proxy"
    "$SYSTEMD_DIR/swap-proxy.service"
    "$SYSTEMD_DIR/swap-inference.service"
)

# --- confirm: confirmd approvals page + confirm-request CLI ---
# Shares proxy's install unit: proxy/deploy.sh installs confirmd's files
# unconditionally, so a confirm-only change must snapshot proxy's files too.
# The health check targets TAILNET (this box's current tailnet IPv4, resolved
# at check time): a pinned tailnet IP goes stale on rekey and would turn
# every later deploy into a false health failure (rollback + blocked commit).
confirm_paths=("confirm/")
confirm_services=("confirmd.service")
confirm_user_services=()
confirm_tests="python3 -c 'import cryptography' && python3 -m pytest confirm/test_confirmd.py confirm/test_push.py confirm/test_push_queue.py -q"
confirm_health=("tcp:TAILNET:8443")
confirm_install=""
confirm_install_unit="proxy-confirm"
confirm_checkout_sync=""
confirm_install_paths=(
    "$SWAPD_HOME/confirmd.py"
    "$SWAPD_HOME/push.py"
    "$BIN_DIR/confirm-request"
    "$SYSTEMD_DIR/confirmd.service"
)

# --- cred-ui: localhost-only credential management web UI ---
# Runs from the working checkout as a systemd USER unit, so the deploy syncs
# the cred-ui/ subtree from the mirror into the checkout (failing closed on
# uncommitted changes there) and then restarts the user service. The UI never
# serves secrets; it only writes via the narrow sudo writers.
cred_ui_paths=("cred-ui/" "VERSION")
# VERSION is claimed by cred-ui AND proxy: a version-only release must
# refresh cred-ui too, because cred-ui reports the repo VERSION by walking
# up from the working checkout — without this it would keep serving the old
# release while every other component reports the new one (docs/VERSIONING.md).
cred_ui_services=()
cred_ui_user_services=("cred-ui.service")
# py_compile is the instant sanity check; the http/version suites are the
# real gate (hermetic: ephemeral localhost port, no secrets — 29 tests in
# ~3s). The gate runs from the repo root, so the dir-relative form works.
cred_ui_tests="python3 -m py_compile cred-ui/cred-ui.py && python3 -m pytest cred-ui/tests/ -q"
cred_ui_health=("tcp:127.0.0.1:18740")
cred_ui_install=""
cred_ui_install_unit=""
cred_ui_checkout_sync="cred-ui"
cred_ui_install_paths=()
