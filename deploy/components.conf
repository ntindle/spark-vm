# deploy/components.conf — deployable-component manifest for auto-deploy.sh.
#
# This file is sourced by deploy/auto-deploy.sh (bash). It is the single place
# that says "repo path X is deployed as service Y with gate Z and health check H".
#
# Per component <c>, define:
#   <c>_paths          (array) repo path prefixes (trailing slash for dirs)
#   <c>_services       (array) systemd SYSTEM units restarted on change
#   <c>_user_services  (array) systemd USER units restarted on change
#   <c>_tests          (string) gate command, eval'd from the mirror repo root
#                              BEFORE any install; empty fails closed
#   <c>_health         (array) "tcp:HOST:PORT" checks after restart
#   <c>_install        (string) install command, eval'd from the mirror repo
#                              root; empty = no install step (restart-only).
#                              The command owns its own privilege (deploy.sh
#                              uses sudo internally).
#   <c>_install_unit   (string, optional) components sharing a value deploy as
#                              one unit: if any member changed, all members are
#                              gated, snapshotted, restarted, and health-checked.
#   <c>_checkout_sync  (string, optional) repo subtree synced from the mirror
#                              at the deployed commit into $WORKING_CHECKOUT
#                              (fails closed on uncommitted changes there).
#   <c>_install_paths  (array) files outside the repo that a deploy writes;
#                      snapshotted before install so rollback can restore them.
#                      May reference $SWAPD_HOME, $BIN_DIR, $SYSTEMD_DIR, or be
#                      literal absolute paths (e.g. /etc/sudoers.d files).
#
# A repo path that matches no component is *pull-only*: the watermark advances
# past it but nothing is installed or restarted.
#
# NOTE: the timer runs the INSTALLED copy of this file
# ($UPDATER_STATE_DIR/bin/components.conf), refreshed by `auto-deploy.sh init`.
# Merging a change to this file does NOT take effect until init is re-run.

COMPONENTS=(proxy confirm cred-ui)

# --- proxy: swap proxy + inference proxy (swap_addon.py, grant writers) ---
proxy_paths=("proxy/")
proxy_services=("swap-proxy.service" "swap-inference.service")
proxy_user_services=()
proxy_tests="python3 -m pytest proxy/test_swap_addon.py proxy/test_grant_writer.py proxy/test_round6.py -q"
proxy_health=("tcp:127.0.0.1:18080" "tcp:127.0.0.1:18081")
proxy_install="bash proxy/deploy.sh --no-restart"
proxy_install_unit="proxy-confirm"
proxy_checkout_sync=""
proxy_install_paths=(
    "$SWAPD_HOME/swap_addon.py"
    "$SWAPD_HOME/grant-writer"
    "$SWAPD_HOME/ssrf.deny"
    # proxy/deploy.sh also writes these on every run (Security review,
    # rollback coverage): the sudoers file is the highest-privilege artifact
    # in the deploy — it must be restorable on rollback too.
    "$SWAPD_HOME/grants.json"
    "/etc/sudoers.d/swapd"
    "/usr/local/share/with-proxy-ca/ca-bundle.crt"
    "$BIN_DIR/cred-grant-revoke"
    "$BIN_DIR/cred-registry-set"
    "$BIN_DIR/cred-registry-set-inference"
    "$BIN_DIR/cred-store-set"
    "$BIN_DIR/cred-store-set-inference"
    "$BIN_DIR/cred-store-get"
    "$BIN_DIR/cred-store-delete"
    "$BIN_DIR/with-proxy"
    "$SYSTEMD_DIR/swap-proxy.service"
    "$SYSTEMD_DIR/swap-inference.service"
)

# --- confirm: confirmd approvals page + confirm-request CLI ---
# Shares proxy's install unit: proxy/deploy.sh installs confirmd's files
# unconditionally, so a confirm-only change must snapshot proxy's files too.
confirm_paths=("confirm/")
confirm_services=("confirmd.service")
confirm_user_services=()
confirm_tests="python3 -m pytest confirm/test_confirmd.py confirm/test_push.py -q"
confirm_health=("tcp:100.65.241.20:8443")
confirm_install=""
confirm_install_unit="proxy-confirm"
confirm_checkout_sync=""
confirm_install_paths=(
    "$SWAPD_HOME/confirmd.py"
    "$SWAPD_HOME/push.py"
    "$BIN_DIR/confirm-request"
    "$SYSTEMD_DIR/confirmd.service"
)

# --- cred-ui: localhost-only credential management web UI ---
# Runs from the working checkout as a systemd USER unit, so the deploy syncs
# the cred-ui/ subtree from the mirror into the checkout (failing closed on
# uncommitted changes there) and then restarts the user service. The UI never
# serves secrets; it only writes via the narrow sudo writers.
cred_ui_paths=("cred-ui/")
cred_ui_services=()
cred_ui_user_services=("cred-ui.service")
cred_ui_tests="python3 -m py_compile cred-ui/cred-ui.py"
cred_ui_health=("tcp:127.0.0.1:18740")
cred_ui_install=""
cred_ui_install_unit=""
cred_ui_checkout_sync="cred-ui"
cred_ui_install_paths=()
