; supervisord config for the spark-vm golden image (#1087).
;
; Fly Machines run Docker images with an ephemeral rootfs — no systemd
; (FLY_DRIVER_RESEARCH.md F1). tini is PID 1 (ENTRYPOINT); supervisord owns
; the daemons. Service commands mirror the repo's systemd units
; (proxy/swap-proxy.service, proxy/swap-inference.service,
; confirm/confirmd.service, confirm/push-worker.service,
; cred-ui/cred-ui.service) so the two cannot diverge silently — the deploy/
; units remain the source of truth for systemd boxes, this file for the image.
;
; Nothing here listens publicly: sshd is key-only (sshd_config.d/sparkvm.conf
; baked by the recipe; host keys are generated on first boot by
; sparkvm-sshd-firstboot.sh — baking one keypair into every tenant's image
; would be a leak), and every other program binds 127.0.0.1. supervisord's
; own inet_http_server is deliberately absent.

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/run/supervisord.pid

[program:data-prep]
; first-boot /data layout (#1205): creates the pinned data-volume
; subdirs (pairing, approvals, confirmd, ssh) with their contract owners
; and the sshd host-key symlinks. Runs before everything that consumes
; /data (priority 5 < the 999 default — supervisord starts programs in
; priority order; this is start-ordering, not a completion barrier, so
; the sshd entrypoint defensively ensures its own /data/ssh precondition
; per the contract's D-V4). One-shot: autorestart=false, startsecs=0.
; Without /data (self-hosted / dev) it exits 0 and changes nothing.
command=/usr/local/bin/data-prep.sh
user=root
priority=5
autorestart=false
startsecs=0
stdout_logfile=/var/log/data-prep.log
stderr_logfile=/var/log/data-prep.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:identity-seed]
; first-boot identity seeding (#1203): reads the D-D6 provision-time env
; (SPARKVM_BOX_ID / SPARKVM_PLANE_URL / SPARKVM_ATTESTATION_TOKEN) and
; presents the attestation token to the pairing client. One-shot, runs
; first (priority 10 < the 999 default — supervisord starts programs in
; priority order; this is start-ordering, not a completion barrier, and
; today no daemon consumes pairing state at startup). autorestart=false so
; a failure stays FATAL and visible instead of flap-restarting.
command=/usr/local/bin/identity-seed-hook.sh
user=root
priority=10
autorestart=false
startsecs=0
stdout_logfile=/var/log/identity-seed.log
stderr_logfile=/var/log/identity-seed.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:sshd]
command=/usr/local/bin/sparkvm-sshd-firstboot.sh
user=root
autorestart=true
startsecs=5
stdout_logfile=/var/log/sshd.log
stderr_logfile=/var/log/sshd.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:swap-proxy]
; mirrors proxy/swap-proxy.service ExecStart
command=/bin/bash -c 'exec /home/swapd/.venvs/mitm/bin/mitmdump -p 18080 --set listen_host=127.0.0.1 -s /home/swapd/swap_addon.py --set termlog_verbosity=warn --set "dumper_filter=~d nomatch.invalid"'
user=swapd
environment=HOME="/home/swapd"
autorestart=true
startsecs=5
stdout_logfile=/var/log/swap-proxy.log
stderr_logfile=/var/log/swap-proxy.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:swap-inference]
; mirrors proxy/swap-inference.service ExecStart
command=/bin/bash -c 'exec /home/swapd/.venvs/mitm/bin/mitmdump -p 18081 --set listen_host=127.0.0.1 -s /home/swapd/swap_addon.py --set termlog_verbosity=warn --set "dumper_filter=~d nomatch.invalid"'
user=swapd
environment=HOME="/home/swapd"
autorestart=true
startsecs=5
stdout_logfile=/var/log/swap-inference.log
stderr_logfile=/var/log/swap-inference.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:confirmd]
; mirrors confirm/confirmd.service ExecStart
command=/usr/bin/python3 /home/swapd/confirmd.py
user=swapd
environment=HOME="/home/swapd"
autorestart=true
startsecs=5
stdout_logfile=/var/log/confirmd.log
stderr_logfile=/var/log/confirmd.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:push-worker]
; mirrors confirm/push-worker.service ExecStart — the H14 retry half
; (GitHub #74): without this program the image's push queue is
; enqueue-only (swapd journals every filed approval, the journal caps at
; 1000, nothing ever drains it). The worker re-checks the #1135
; plane-handoff every pass: explicit SPARKVM_PLANE_PUSH env (the documented
; override), then the root-written signal file /run/sparkvm/plane-push
; (GitHub #1268 — identity-seed-hook.sh rewrites it at boot from the
; hook's own (root) enrollment record, since this swapd program cannot
; read the pairing record; an operator-redeemed box propagates via the
; --propagate-plane-push-signal flag instead), then record auto-detect. On a
; self-hosted/dev image the signal file is absent and the contract's
; fail-open auto-detect keeps the box-local queue; a later enrollment
; propagates without a worker restart once the file is written (run
; identity-seed-hook.sh --propagate-plane-push-signal as root after a
; manual `redeem`). environment carries the unit's CONFIRM_DIR
; explicitly (the worker and confirmd share the approvals dir).
command=/usr/bin/python3 /home/swapd/push.py --worker
user=swapd
environment=HOME="/home/swapd",CONFIRM_DIR="/home/swapd/approvals"
autorestart=true
startsecs=5
stdout_logfile=/var/log/push-worker.log
stderr_logfile=/var/log/push-worker.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:cred-ui]
; cred-ui runtime is installed to the skeleton agent home by the recipe
; (cred-ui/install.sh with CRED_UI_INSTALL_DIR set); localhost-only
command=/usr/bin/python3 /home/agent/.local/share/spark-vm/cred-ui/cred-ui.py
user=agent
environment=HOME="/home/agent"
autorestart=true
startsecs=5
stdout_logfile=/var/log/cred-ui.log
stderr_logfile=/var/log/cred-ui.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:cua-stack]
; cua-desktop.sh start launches Xvfb :98 + D-Bus + XFCE + the cua-driver
; daemon and returns; the tail keeps supervisord's child alive so a stack
; failure is visible (the 5-min keepalive below is the self-healer).
; NOTE: no `exec` before the `;` — `exec` replaces the shell, so
; `exec ... && exec tail` would never reach the tail and supervisord would
; flap-restart the desktop stack forever.
command=/bin/bash -c '/home/agent/cua/bin/cua-desktop.sh start; exec tail -f /dev/null'
user=agent
environment=HOME="/home/agent"
autorestart=true
startsecs=10
stdout_logfile=/var/log/cua-stack.log
stderr_logfile=/var/log/cua-stack.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:cua-bridge]
; localhost-only HTTP bridge on 127.0.0.1:18731 (cua/README.md chain)
command=/usr/bin/python3 /home/agent/cua/bin/cua-bridge.py
user=agent
environment=HOME="/home/agent"
autorestart=true
startsecs=5
stdout_logfile=/var/log/cua-bridge.log
stderr_logfile=/var/log/cua-bridge.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:cua-keepalive]
; the live box's 5-min cron (cua-keepalive.sh) restarts anything down; the
; image has no cron, so supervisord runs the same loop.
command=/bin/bash -c 'while true; do /home/agent/cua/bin/cua-keepalive.sh; sleep 300; done'
user=agent
environment=HOME="/home/agent"
autorestart=true
startsecs=5
stdout_logfile=/var/log/cua-keepalive.log
stderr_logfile=/var/log/cua-keepalive.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:pair-heartbeat]
; the pairing heartbeat one-shot (pairing/README.md ### Inventory, #864):
; one POST /v1/boxes/{id}/heartbeat per minute. The image has no cron, so
; supervisord runs the loop (the cua-keepalive program is the in-image
; precedent). Cadence is loop-iteration (60s + tick runtime), not
; wall-clock cron — documented, accepted: a slow plane stretches the
; cadence instead of stacking invocations (the .heartbeat.lock EX blocking
; flock serializes overlaps anyway). A failed tick exits the one-shot, not
; the loop (cron semantics: the next tick retries); failure detail lands
; in the state-dir heartbeat.log (failures only, append-only) per the
; README. Runs as the box-service user (#1220 Option B); HOME points at its
; home so the client defaults to its state dir.
; NOTE (#1363): ingest + upload-filings are NOT wired here yet — they need
; swapd-owned stores the sparkpair split cannot reach (see #1363 for the
; store-access design). They stay unwired until that design lands; this
; program deliberately covers only the pure-pairing-state heartbeat.
command=/bin/bash -c 'while true; do /usr/bin/python3 /opt/sparkvm/pairing/spark_pair.py heartbeat; sleep 60; done'
user=sparkpair
environment=HOME="/home/sparkpair"
autorestart=true
startsecs=5
stdout_logfile=/var/log/pair-heartbeat.log
stderr_logfile=/var/log/pair-heartbeat.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:pair-rotate]
; token rotation (#846): `rotate --auto` one-shot, hourly cadence. Same
; loop shape as pair-tick (no cron on the image); without this program the
; 24h box Bearer <redacted> 401s the box within a day of enrollment (#1219).
command=/bin/bash -c 'while true; do /usr/bin/python3 /opt/sparkvm/pairing/spark_pair.py rotate --auto; sleep 3600; done'
user=sparkpair
environment=HOME="/home/sparkpair"
autorestart=true
startsecs=5
stdout_logfile=/var/log/pair-rotate.log
stderr_logfile=/var/log/pair-rotate.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:pair-phone-home]
; the persistent outbound WSS session (#959/#976) — a real daemon under
; the supervisor, never cron (pairing/README.md). Exit-code semantics are
; the supervisor's restart policy: exit 0 = clean stop on SIGTERM/SIGINT
; (no restart); exit 1 = deliberate human-attention exit (revoked token,
; protocol errors — the supervisor never restarts these); exit 2 =
; unexpected crash (uncaught exception — restarts). autorestart=unexpected
; with exitcodes=0,1 expresses exactly that: only an exit outside {0,1}
; is "unexpected". The non-blocking .phone-home.lock for the daemon's life
; keeps a second instance from forking the generation counter.
command=/usr/bin/python3 /opt/sparkvm/pairing/spark_pair.py phone-home
user=sparkpair
environment=HOME="/home/sparkpair"
autorestart=unexpected
exitcodes=0,1
startsecs=5
stdout_logfile=/var/log/pair-phone-home.log
stderr_logfile=/var/log/pair-phone-home.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
