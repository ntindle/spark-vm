# spark-vm swap proxy audit-log rotation (GitHub #198).
#
# Installed by proxy/deploy.sh into /etc/logrotate.d/swap-proxy.
#
# swap.log is append-only with no writer-side bound; on a long-lived
# proxy it grows until the disk fills — and the audit write is part of
# authorization, so a full disk fails EVERY swap closed: a total outage
# of credentialed egress. This policy bounds the trail without ever
# dropping it: size-triggered rotation keeps 12 generations compressed.
#
# Compatibility: swap_addon.py opens/appends/closes the log on every
# audit write (no persistent file descriptor), so logrotate's default
# rename+create is race-free — no postrotate signal needed, and no audit
# line can be lost across the rotate boundary. (copytruncate is NOT
# used: with rename, a line written during the rotate lands in exactly
# one generation.)
/home/swapd/swap.log /home/swapd/inference-swap.log {
    weekly
    size 50M
    rotate 12
    create 0600 swapd swapd
    missingok
    notifempty
    compress
    delaycompress
}
