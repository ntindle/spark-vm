# self_update_pins.conf — known-good / held versions for the spark-vm toolset
# (issue #532).
#
# Slice S1 (`self_update.py status`) only REPORTS drift against these pins;
# nothing enforces or installs anything yet. A pin exists where a breaking
# change would hurt: the updater holds the tool on the pin until the pin is
# deliberately bumped (with a changelog note).
#
# Format: one `tool = version` per line. Blank lines and `#` comments ignored.
# Tool names must match the probe names in self_update.py's PROBES registry.

# CUA driver: held on the version the cua/ bridge was validated against.
cua-driver = 0.28.2
